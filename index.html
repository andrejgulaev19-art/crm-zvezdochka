<script>
/* ============================================================
   ПАТЧ v4.4 — Время программы на Панели + Автозаполнение дат
   Требует: v4.1 (добавляет поля дат программы)
   ============================================================ */
(function(){
  'use strict';

  /* 1. Автозаполнение дат программы при выборе или смене дат брони */
  function autoFillProgramDates() {
    const form = document.getElementById('bookingForm');
    if (!form) return;
    const progId = form.querySelector('[name=bookingProgramId]')?.value;
    if (!progId) return;

    const checkIn = form.querySelector('[name=checkInDate]')?.value;
    const progStart = form.querySelector('[name=programStartDate]');
    const progEnd = form.querySelector('[name=programEndDate]');

    if (!progStart || !progEnd) return;

    if (checkIn) {
      // Если поле пустое, автоматически ставим дату заезда
      if (!progStart.value) progStart.value = checkIn;
      // Если поле пустое, ставим ту же дату для окончания (обычно программа в один день)
      if (!progEnd.value) progEnd.value = checkIn;
    }
  }

  // Вешаем слушатель на изменение нужных полей через делегирование событий
  document.addEventListener('change', function(e) {
    if (!e.target.closest('#bookingForm')) return;
    const name = e.target.name;
    if (['checkInDate', 'checkOutDate', 'bookingProgramId'].includes(name)) {
      autoFillProgramDates();
    }
  });

  // Кнопка "Заполнить" из панели проверки занятости
  document.addEventListener('click', function(e) {
    if (e.target.closest('button[onclick="fillBookingFromCheck()"]')) {
      setTimeout(autoFillProgramDates, 100);
    }
  });

  /* 2. Подстановка дат при редактировании существующей брони */
  const _origEditBooking = window.editBooking;
  window.editBooking = function(id) {
    _origEditBooking(id);
    setTimeout(autoFillProgramDates, 400); // ждём, пока отработает оригинальная функция
  };

  /* 3. Отображение времени программы на Панели (Дашборд) */
  const _origRenderDashboard = window.renderDashboard;
  window.renderDashboard = function() {
    _origRenderDashboard();
    
    // Небольшая задержка, чтобы оригинальный HTML успел отрисоваться
    setTimeout(() => {
      const cards = document.querySelectorAll('#recentActivity > div');
      cards.forEach(card => {
        const onclickAttr = card.getAttribute('onclick');
        // Ищем карточки, которые открывают бронь по клику
        if (onclickAttr && onclickAttr.includes('viewBookingDetail')) {
          const match = onclickAttr.match(/viewBookingDetail\('([^']+)'\)/);
          if (match) {
            const bId = match[1];
            const b = gd('bookings').find(x => x.id === bId);
            
            // Если у брони есть программа — ищем текст в карточке и дописываем время
            if (b && b.bookingProgramId) {
              const prog = gd('programs').find(p => p.id === b.bookingProgramId);
              if (prog) {
                const divs = card.querySelectorAll('div[style*="grid-template-columns:1fr 1fr"] > div');
                divs.forEach(div => {
                  // Находим блок с программой и проверяем, не добавлено ли уже время (скобки)
                  if (div.innerHTML.includes('🎮') && !div.innerHTML.includes('(')) {
                    const timeStr = (b.programStartTime || b.programEndTime) ? ` (${b.programStartTime || ''}${b.programEndTime ? ' - ' + b.programEndTime : ''})` : '';
                    // Заменяем название на "Название (Время)"
                    div.innerHTML = div.innerHTML.replace(prog.name, prog.name + timeStr);
                  }
                });
              }
            }
          }
        }
      });
    }, 50); // 50 мс достаточно для перерисовки DOM
  };

  console.log('✅ Патч v4.4 применён (Время программы на панели + автозаполнение)');
})();
</script>
